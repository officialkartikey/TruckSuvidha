services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trucksuvidha-gps-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/trucksuvidha_gps
      - JWT_SECRET=change_this_to_a_secure_production_secret_key_32chars
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - DEVICE_OFFLINE_TIMEOUT_SECONDS=120
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - DEVICE_RATE_LIMIT_MAX_REQUESTS=600
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: trucksuvidha-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local
